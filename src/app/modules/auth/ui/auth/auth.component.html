<section class="flex min-h-screen items-center justify-center bg-[var(--surface-ground)]">
  <p-card styleClass="w-full max-w-md shadow-3">
    <ng-template #header>
      <div class="flex flex-col items-center gap-3 pt-8 pb-4">
        <span
          class="grid h-12 w-12 grid-cols-2 gap-1 rounded-xl bg-[var(--primary-500)] p-2"
          aria-hidden="true"
        >
          <span class="rounded-[3px] bg-white/30"></span>
          <span class="rounded-[3px] bg-white/30"></span>
          <span class="rounded-[3px] bg-white/30"></span>
          <span class="rounded-[3px] bg-white"></span>
        </span>
        <h1 class="text-2xl font-semibold text-[var(--primary-600)]">Iniciar sesión</h1>
      </div>
    </ng-template>

    @if (error(); as message) {
      <p-message severity="error" [text]="message" styleClass="mb-4 w-full" />
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5" novalidate>
      <div class="flex flex-col gap-2">
        <label for="username" class="font-medium text-[var(--text-color)]">Usuario</label>
        <p-iconfield iconPosition="left">
          <p-inputicon styleClass="pi pi-user" />
          <input
            pInputText
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="Tu usuario"
            [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
            aria-describedby="username-error"
            class="w-full"
          />
        </p-iconfield>
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <small id="username-error" class="text-red-500">El usuario es obligatorio.</small>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label for="password" class="font-medium text-[var(--text-color)]">Contraseña</label>
        <p-iconfield iconPosition="left">
          <p-inputicon styleClass="pi pi-lock" />
          <input
            pInputText
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
            aria-describedby="password-error"
            class="w-full"
          />
        </p-iconfield>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <small id="password-error" class="text-red-500">La contraseña es obligatoria.</small>
        }
      </div>

      <p-button
        type="submit"
        label="Entrar"
        severity="primary"
        [loading]="submitting()"
        [disabled]="submitting()"
        styleClass="w-full"
        icon="pi pi-sign-in"
      />
    </form>
  </p-card>
</section>
