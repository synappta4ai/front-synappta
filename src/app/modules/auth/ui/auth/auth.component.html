<section class="flex min-h-screen items-center justify-center bg-[var(--content-bg)]">
  <div
    class="w-full max-w-md rounded-2xl border border-[var(--border-color)] bg-[var(--surface-0)] p-8 shadow-sm"
  >
    <h1
      class="mb-6 text-center text-2xl font-semibold text-[var(--primary-600)] dark:text-[var(--primary-400)]"
    >
      Iniciar sesi&oacute;n
    </h1>

    @if (error(); as message) {
      <div
        role="alert"
        class="mb-4 rounded-lg bg-[var(--red-50)] p-3 text-sm text-[var(--red-700)] dark:bg-[var(--red-950)] dark:text-[var(--red-300)]"
      >
        {{ message }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
      <div class="flex flex-col gap-1">
        <label for="username" class="text-sm font-medium text-[var(--text-secondary)]"
          >Usuario</label
        >
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
          aria-describedby="username-error"
          class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <p id="username-error" class="text-xs text-[var(--red-600)] dark:text-[var(--red-400)]">
            El usuario es obligatorio.
          </p>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label for="password" class="text-sm font-medium text-[var(--text-secondary)]"
          >Contrase&ntilde;a</label
        >
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
          aria-describedby="password-error"
          class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <p id="password-error" class="text-xs text-[var(--red-600)] dark:text-[var(--red-400)]">
            La contrase&ntilde;a es obligatoria.
          </p>
        }
      </div>

      <button
        type="submit"
        [disabled]="submitting()"
        class="rounded-lg bg-[var(--primary-500)] px-4 py-2.5 text-sm font-medium text-white hover:bg-[var(--primary-600)] active:bg-[var(--primary-700)] disabled:opacity-50"
      >
        {{ submitting() ? 'Entrando\u2026' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>
