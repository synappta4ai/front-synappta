@if (loading()) {
  <p class="muted small">{{ 'SHARED.MODEL_SELECT_LOADING' | translate }}</p>
} @else if (failed()) {
  <p class="muted small">{{ 'SHARED.MODEL_SELECT_ERROR' | translate }}</p>
} @else if (empty()) {
  <p class="muted small">{{ 'SHARED.MODEL_SELECT_EMPTY' | translate }}</p>
} @else {
  <p-select
    [inputId]="inputId()"
    [formControl]="control"
    [options]="filtered()"
    optionLabel="display_name"
    optionValue="name"
    [placeholder]="placeholder() ?? ('SHARED.MODEL_SELECT_PLACEHOLDER' | translate)"
    [showClear]="false"
    class="w-full"
    appendTo="body"
  >
    <ng-template #item let-m>
      <div class="flex items-center justify-between gap-2 w-full">
        <div class="min-w-0">
          <p class="font-bold truncate">{{ m.display_name ?? m.name }}</p>
          <p class="text-xs opacity-60 truncate">{{ m.name }}</p>
        </div>
        <p-tag
          [value]="providerTag(m.credential_provider)"
          [severity]="isLocalProvider(m.credential_provider) ? 'success' : 'info'"
          styleClass="text-xs shrink-0"
        />
      </div>
    </ng-template>
  </p-select>
}
