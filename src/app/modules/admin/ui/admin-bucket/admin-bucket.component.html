@if (tenant(); as tenant) {
  <div class="mx-auto flex h-full min-h-0 w-full max-w-4xl flex-col gap-3 overflow-y-auto pb-4">
    <div>
      <h2 class="text-lg font-bold text-ink">
        {{ 'ADMIN.STORAGE.HEADER' | translate: { name: tenant.name } }}
      </h2>
    </div>
    <app-tenant-storage-dialog [tenant]="tenant" [inline]="true" />
  </div>
}
