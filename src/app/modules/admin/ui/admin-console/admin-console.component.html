<div class="admin-shell flex flex-col gap-3 px-4 pt-4 sm:px-6" [style.height.px]="shellHeight()">
  <!-- Header: tenant en gestión + acceso a la lista de tenants -->
  <header class="flex flex-wrap items-center gap-x-4 gap-y-2">
    <div class="min-w-0">
      <h1 class="text-xl font-bold text-ink">{{ 'ADMIN.CONSOLE.TITLE' | translate }}</h1>
      <p class="text-xs text-ink-muted-on-dark">{{ 'ADMIN.CONSOLE.SUBTITLE' | translate }}</p>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <div class="w-[20rem] max-w-[60vw]">
        @if (loadingTenants()) {
          <div class="skel skel-text" aria-hidden="true"></div>
        } @else {
          <p-select
            [options]="tenantOptions()"
            [ngModel]="selectedTenantId()"
            (ngModelChange)="onTenantChange($event)"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            [filterPlaceholder]="'ADMIN.CONSOLE.TENANT_SEARCH' | translate"
            [placeholder]="'ADMIN.CONSOLE.TENANT_PLACEHOLDER' | translate"
            [attr.aria-label]="'ADMIN.CONSOLE.TENANT_ARIA' | translate"
            styleClass="w-full"
            appendTo="body"
          />
        }
      </div>

      @if (isSuperadmin()) {
        <p-button
          [label]="'ADMIN.CONSOLE.MANAGE_TENANTS' | translate"
          icon="md md-business"
          size="small"
          outlined
          [pTooltip]="'ADMIN.CONSOLE.MANAGE_TENANTS_HINT' | translate"
          tooltipPosition="bottom"
          showDelay="400"
          (onClick)="goToTenants()"
        />
      }
    </div>
  </header>

  <!-- Pestañas (según rol) -->
  <p-tabView [(activeIndex)]="activeTabIndex" (onTabChange)="onTabChange($event)" styleClass="admin-tabs">
    @for (tab of tabs(); track tab.route; let i = $index) {
      <p-tabPanel>
        <ng-template pTemplate="header">
          <div class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 text-sm font-medium text-ink-on-dark hover:bg-surface-2">
            <i [class]="tab.icon" class="text-sm"></i>
            <span>{{ tab.label }}</span>
          </div>
        </ng-template>
      </p-tabPanel>
    }
  </p-tabView>

  <div class="min-h-0 flex-1 overflow-hidden">
    <router-outlet />
  </div>
</div>
