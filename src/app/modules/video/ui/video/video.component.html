<app-page-container title="Generación de video">
  @if (error(); as message) {
    <div
      role="alert"
      class="mb-4 rounded-lg bg-[var(--red-50)] p-3 text-sm text-[var(--red-700)] dark:bg-[var(--red-950)] dark:text-[var(--red-300)]"
    >
      {{ message }}
    </div>
  }

  @if (resultUrl(); as url) {
    <div
      class="mb-6 rounded-lg border border-[var(--green-200)] bg-[var(--green-50)] p-4 dark:border-[var(--green-800)] dark:bg-[var(--green-950)]"
    >
      <p class="mb-2 text-sm font-medium text-[var(--green-700)] dark:text-[var(--green-300)]">
        ¡Video generado!
      </p>
      <video controls class="w-full rounded-md">
        <source [src]="url" type="video/mp4" />
        Tu navegador no soporta video HTML5.
      </video>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
    <div class="flex flex-col gap-1">
      <label for="model" class="text-sm font-medium text-[var(--text-secondary)]">Modelo</label>
      <input
        id="model"
        type="text"
        formControlName="model"
        placeholder="dreamina-seedance-2-0-260128"
        class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="prompt" class="text-sm font-medium text-[var(--text-secondary)]">Prompt</label>
      <textarea
        id="prompt"
        formControlName="prompt"
        rows="3"
        class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
      ></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label for="eventId" class="text-sm font-medium text-[var(--text-secondary)]"
          >Event ID</label
        >
        <input
          id="eventId"
          type="text"
          formControlName="eventId"
          class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
        />
      </div>
      <div class="flex flex-col gap-1">
        <label for="pieceId" class="text-sm font-medium text-[var(--text-secondary)]"
          >Piece ID</label
        >
        <input
          id="pieceId"
          type="text"
          formControlName="pieceId"
          class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
        />
      </div>
      <div class="flex flex-col gap-1">
        <label for="pieceCode" class="text-sm font-medium text-[var(--text-secondary)]"
          >Piece Code</label
        >
        <input
          id="pieceCode"
          type="text"
          formControlName="pieceCode"
          class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
        />
      </div>
      <div class="flex flex-col gap-1">
        <label for="generationNumber" class="text-sm font-medium text-[var(--text-secondary)]"
          >Generation #</label
        >
        <input
          id="generationNumber"
          type="number"
          formControlName="generationNumber"
          class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
        />
      </div>
      <div class="flex flex-col gap-1">
        <label for="duration" class="text-sm font-medium text-[var(--text-secondary)]"
          >Duración (s)</label
        >
        <input
          id="duration"
          type="number"
          formControlName="duration"
          class="rounded-lg border border-[var(--surface-300)] bg-[var(--surface-0)] px-3 py-2 text-sm text-[var(--text-primary)] focus:border-[var(--primary-500)] focus:outline-none dark:border-[var(--surface-600)]"
        />
      </div>
    </div>

    <button
      type="submit"
      [disabled]="submitting() || polling()"
      class="rounded-lg bg-[var(--primary-500)] px-4 py-2 text-sm font-medium text-white hover:bg-[var(--primary-600)] active:bg-[var(--primary-700)] disabled:opacity-50"
    >
      @if (submitting()) {
        Enviando…
      } @else if (polling()) {
        Generando… (esto puede tardar varios minutos)
      } @else {
        Generar video
      }
    </button>
  </form>
</app-page-container>
