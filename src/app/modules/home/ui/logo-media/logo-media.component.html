<div class="logo-media" [class.logo-media-masked]="masked()">
  <div class="logo-media-frame" [style.aspect-ratio]="frameRatio()">
    @if (videoSrc()) {
      <video
        #media
        class="logo-media-content"
        [poster]="src()"
        [attr.aria-label]="alt()"
        autoplay
        muted
        loop
        playsinline
        preload="none"
        disablepictureinpicture
      >
        <!-- Video final: <source [src]="videoSrc()" type="video/mp4" /> (ver home-media.ts) -->
      </video>
    } @else {
      <img
        #media
        class="logo-media-content"
        [src]="src()"
        [alt]="alt()"
        [loading]="eager() ? 'eager' : 'lazy'"
        decoding="async"
      />
    }
  </div>
</div>
