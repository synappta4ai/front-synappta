<button
  type="button"
  class="inline-flex h-9 w-9 items-center justify-center rounded-xl text-ink-on-dark transition-colors hover:bg-surface-hover"
  aria-label="Configuración de tema"
  pTooltip="Configuración de tema"
  showDelay="400"
  (click)="togglePopover($event)"
>
  <i class="md md-settings text-xl" aria-hidden="true"></i>
</button>

<p-popover #popover styleClass="theme-popover" [style]="{ width: '280px' }">
  <div class="theme-panel">
    <!-- User Profile Section -->
    <div class="user-section">
      <div class="user-avatar">
        <img [src]="userAvatarUrl" [alt]="currentUser()?.name ?? 'User'" loading="lazy" />
      </div>
      <div class="user-info">
        <h4 class="user-name">{{ currentUser()?.name }} {{ currentUser()?.surname }}</h4>
        <span class="user-role">{{ currentUser()?.role_name }}</span>
      </div>
    </div>

    <!-- Menu Items -->
    <div class="menu-section">
      <button class="menu-item">
        <i class="md md-person menu-icon"></i>
        <span>Tu perfil</span>
      </button>

      <button class="menu-item">
        <i class="md md-settings menu-icon"></i>
        <span>Configuraci&oacute;n</span>
      </button>

      <button class="menu-item logout" (click)="onLogout()">
        <i class="md md-logout menu-icon"></i>
        <span>Cerrar sesi&oacute;n</span>
      </button>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Mode Section -->
    <div class="section">
      <h5 class="section-title">Apariencia</h5>
      <div class="mode-toggle seg-slide">
        <button
          class="mode-btn seg-btn"
          [class.active]="currentMode() === 'light'"
          (click)="onModeChange('light')"
        >
          <i class="md md-light_mode mode-icon"></i>
          <span>Claro</span>
        </button>

        <button
          class="mode-btn seg-btn"
          [class.active]="currentMode() === 'dark'"
          (click)="onModeChange('dark')"
        >
          <i class="md md-dark_mode mode-icon"></i>
          <span>Oscuro</span>
        </button>
      </div>
    </div>

    <!-- Accent Section -->
    <div class="section">
      <h5 class="section-title">Acento</h5>
      <div class="color-grid">
        @for (accent of accents; track accent.id) {
          <button
            class="color-btn"
            [class.active]="currentAccent() === accent.id"
            (click)="onAccentChange(accent.id)"
            [attr.aria-pressed]="currentAccent() === accent.id"
          >
            <span class="color-dot" [style.background-color]="accent.color"></span>
            <span class="color-name">{{ accent.name }}</span>
          </button>
        }
      </div>
    </div>
  </div>
</p-popover>
