<button type="button" class="compact-chip" aria-haspopup="listbox" (click)="pop.toggle($event)">
  <span class="compact-chip-label">{{ label() }}</span>
  <span class="compact-chip-value">{{ selectedLabel() }}</span>
  <i class="md md-expand_more compact-chip-chevron" aria-hidden="true"></i>
</button>

<p-popover #pop styleClass="compact-popover">
  <div class="compact-list" role="listbox" [attr.aria-label]="label()">
    @for (option of options(); track option.value) {
      <button
        type="button"
        role="option"
        class="compact-option"
        [class.active]="option.value === value()"
        [attr.aria-selected]="option.value === value()"
        (click)="choose(option.value, pop)"
      >
        <span>{{ option.label }}</span>
        @if (option.value === value()) {
          <i class="md md-check" aria-hidden="true"></i>
        }
      </button>
    }
  </div>
</p-popover>
