<button
  type="button"
  class="compact-chip"
  [class.is-configured]="configured()"
  [class.is-attention]="attention()"
  aria-haspopup="dialog"
  [attr.data-hint]="hint() || ('SHARED.COMPACT.NUMBER_HINT' | translate)"
  (click)="pop.toggle($event)"
>
  <span class="compact-chip-label">{{ label() }}</span>
  <span class="compact-chip-value">{{ display() }}</span>
  <i class="md md-expand_more compact-chip-chevron" aria-hidden="true"></i>
</button>

<p-popover #pop styleClass="compact-popover" (onShow)="focusInput()">
  <div class="compact-number">
    <label class="compact-number-label" for="compactNumberInput">{{ label() }}</label>
    <div class="compact-number-row">
      <button
        type="button"
        class="compact-step"
        [attr.data-hint]="'SHARED.COMPACT.DECREMENT' | translate: { step: step() }"
        [attr.aria-label]="'SHARED.COMPACT.DECREMENT' | translate: { step: step() }"
        (click)="bump(-1)"
      >
        −
      </button>
      <input
        #numberInput
        id="compactNumberInput"
        class="compact-number-input"
        type="number"
        [value]="value() ?? ''"
        [attr.min]="min()"
        [attr.max]="max()"
        [attr.step]="step()"
        [attr.placeholder]="placeholder()"
        (input)="onInput($event)"
        (keydown.enter)="pop.hide()"
      />
      <button
        type="button"
        class="compact-step"
        [attr.data-hint]="'SHARED.COMPACT.INCREMENT' | translate: { step: step() }"
        [attr.aria-label]="'SHARED.COMPACT.INCREMENT' | translate: { step: step() }"
        (click)="bump(1)"
      >
        +
      </button>
    </div>
    @if (suffix()) {
      <span class="compact-number-suffix">{{ suffix() }}</span>
    }
  </div>
</p-popover>
