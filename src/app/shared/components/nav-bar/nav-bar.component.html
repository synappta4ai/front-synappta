<header class="sticky top-0 z-20 w-full">
  <p-menubar [model]="menuItems()" styleClass="custom-menubar">
    <ng-template #start>
      <a routerLink="/" class="mr-6 flex items-center gap-3">
        <img src="assets/img/sinappta-logo-sqared.png" alt="Logo Synapta" class="h-9 w-9" />
        <img src="assets/img/sinappta-title.png" alt="Synapta" class="navbar-title h-9 w-auto" />
      </a>
    </ng-template>
    <ng-template #end>
      <div class="flex items-center gap-3">
        <app-generation-bell />
        <app-theme-panel />
      </div>
    </ng-template>
  </p-menubar>
</header>
