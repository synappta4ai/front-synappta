<header class="sticky top-0 z-20 w-full">
  <p-menubar
    [model]="menuItems()"
    styleClass="custom-menubar"
    appSlidePill=".p-menubar-item-link"
    activeClass="p-menubar-item-link-active"
    pillClass="nav-pill"
    containerSelector=".p-menubar-root-list"
  >
    <ng-template #start>
      <a routerLink="/" class="mr-6 flex items-center gap-3 text-white">
        @if (navAvatarUrl(); as avatar) {
          <img
            [src]="avatar | serverUrl"
            alt="{{ 'SHARED.NAV.AVATAR_ALT' | translate }}"
            width="36"
            height="36"
            class="h-9 w-9 rounded-full object-cover"
          />
        } @else {
          <img
            ngSrc="assets/img/sinappta-logo-sqared.png"
            alt="{{ 'SHARED.NAV.LOGO_ALT' | translate }}"
            width="36"
            height="36"
            class="h-9 w-9"
          />
        }
        <img
          ngSrc="assets/img/sinappta-title-white.png"
          alt="Synapta"
          width="152"
          height="36"
          class="h-5.5 w-auto"
        />
      </a>
    </ng-template>
    <ng-template #end>
      <div class="flex items-center gap-3">
        <app-generation-bell />
        <app-theme-panel />
      </div>
    </ng-template>
  </p-menubar>

  <p-popover #toolsPopover styleClass="tools-popover">
    <div class="pop-head">
      <span><i class="md md-auto_fix_high"></i> {{ 'TOOLS.TITLE' | translate }}</span>
    </div>
    <div class="pop-list">
      @for (tool of toolItems(); track tool.routerLink) {
        <a [routerLink]="tool.routerLink" class="pop-item" (click)="hideTools()">
          <span class="pop-thumb icon"><i [class]="tool.icon"></i></span>
          <span class="pop-info">
            <span class="pop-model">{{ tool.label }}</span>
            <span class="pop-prompt">{{ tool.description }}</span>
          </span>
          <i class="md md-chevron_right pop-go"></i>
        </a>
      }
    </div>
  </p-popover>
</header>
